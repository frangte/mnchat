services:
  mysql:
    image: mysql:9
    command: --server-id=1 --gtid-mode=ON --enforce-gtid-consistency=ON --innodb-ft-min-token-size=2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mnchat
      MYSQL_USER: mnchat
      MYSQL_PASSWORD: mnchat
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Read-only copy for search. Database and users arrive through replication.
  mysql-replica:
    image: mysql:9
    command: --server-id=2 --gtid-mode=ON --enforce-gtid-consistency=ON --innodb-ft-min-token-size=2
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./deploy/mysql/replica-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: .
    environment:
      MYSQL_DSN: mnchat:mnchat@tcp(mysql:3306)/mnchat?parseTime=true&loc=UTC
      JWT_SECRET: dev-secret-change-me
      SEARCH_GRPC_ADDR: search:9190
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  search:
    build:
      context: .
      dockerfile: Dockerfile.search
    environment:
      SEARCH_MYSQL_DSN: search_reader:search_reader@tcp(mysql-replica:3306)/mnchat?parseTime=true&loc=UTC
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "9190:9190"
      - "9191:9191"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql-replica:
        condition: service_healthy

  # Monitoring. Nothing in chat or search depends on these, so stopping them changes nothing.
  # Exporters connect per scrape, so they start in any order and report mysql_up 0 meanwhile.
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter

  mysqld-exporter-replica:
    image: prom/mysqld-exporter:v0.20.0
    command: ["--mysqld.address=mysql-replica:3306", "--mysqld.username=exporter", "--collect.slave_status"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: exporter

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      # Lets T12 reload alert rules with POST /-/reload instead of a restart.
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.4.13
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Load generator. Only `--profile load` starts it (make load, make chaos-search), never make up.
  k6:
    image: grafana/k6:1.8.1
    profiles: [load]
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ./deploy/load:/scripts:ro

volumes:
  mysql-data:
  mysql-replica-data:
  prometheus-data:
