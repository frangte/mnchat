# Prometheus for the local MNChat stack. Metric names are a contract, see
# docs/tasks/CONTRACTS.md. A 5 s scrape keeps the demo lively.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:8080']

  - job_name: search
    static_configs:
      - targets: ['search:9191']

  - job_name: mysql
    static_configs:
      - targets: ['mysqld-exporter:9104']
        labels: { role: primary }
      - targets: ['mysqld-exporter-replica:9104']
        labels: { role: replica }
