services:
  mysql:
    image: mysql:9
    command: --server-id=1 --gtid-mode=ON --enforce-gtid-consistency=ON --innodb-ft-min-token-size=2
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mnchat
      MYSQL_USER: mnchat
      MYSQL_PASSWORD: mnchat
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/primary-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Read-only copy for search. Database and users arrive through replication.
  mysql-replica:
    image: mysql:9
    command: --server-id=2 --gtid-mode=ON --enforce-gtid-consistency=ON --innodb-ft-min-token-size=2
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-replica-data:/var/lib/mysql
      - ./deploy/mysql/replica-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: .
    environment:
      MYSQL_DSN: mnchat:mnchat@tcp(mysql:3306)/mnchat?parseTime=true&loc=UTC
      JWT_SECRET: dev-secret-change-me
      SEARCH_GRPC_ADDR: search:9190
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  search:
    build:
      context: .
      dockerfile: Dockerfile.search
    environment:
      SEARCH_MYSQL_DSN: search_reader:search_reader@tcp(mysql-replica:3306)/mnchat?parseTime=true&loc=UTC
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "9190:9190"
      - "9191:9191"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql-replica:
        condition: service_healthy

volumes:
  mysql-data:
  mysql-replica-data:
