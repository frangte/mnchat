# Loads every dashboard JSON in deploy/observability/grafana/dashboards/ into one folder.
apiVersion: 1

providers:
  - name: mnchat
    folder: MNChat
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
